
services:
  # ==========================================
  # NÚCLEO SIGMA (Padrão)
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: sigma-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sigma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigmapassword}
      POSTGRES_DB: ${POSTGRES_DB:-sigmadb}
    volumes:
      - sigma-db-data:/var/lib/postgresql/data
    networks:
      - sigma-net
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:1.80.0
    container_name: sigma-n8n
    ports:
      - "${N8N_BIND_IP:-127.0.0.1}:5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASS:-adminpassword}
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - sigma-net
    restart: unless-stopped

  # ==========================================
  # PERFIL DE OBSERVABILIDADE (Opcional)
  # Executar com: docker compose --profile monitoring up -d
  # ==========================================
  postgres-server:
    image: postgres:15-alpine
    container_name: zabbix-db
    profiles:
      - monitoring
    environment:
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASS:-zabbixpassword}
      POSTGRES_DB: zabbix
    volumes:
      - zabbix-db-data:/var/lib/postgresql/data
    networks:
      - sigma-net
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-6.4-latest
    container_name: zabbix-server
    profiles:
      - monitoring
    environment:
      DB_SERVER_HOST: postgres-server
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASS:-zabbixpassword}
      POSTGRES_DB: zabbix
    ports:
      - "10051:10051"
    depends_on:
      - postgres-server
    networks:
      - sigma-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: sigma-grafana
    profiles:
      - monitoring
    ports:
      - "${GRAFANA_BIND_IP:-127.0.0.1}:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - sigma-net
    restart: unless-stopped

volumes:
  sigma-db-data:
  n8n-data:
  zabbix-db-data:
  grafana-data:

networks:
  sigma-net:
    driver: bridge
