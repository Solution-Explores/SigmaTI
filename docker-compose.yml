version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: sigma-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: sigmadb
    ports:
      - "5432:5432"
    volumes:
      - sigma_data:/var/lib/postgresql/data

volumes:
  sigma_data: