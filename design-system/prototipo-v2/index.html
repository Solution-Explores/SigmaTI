<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SigmaTI · Protótipo v2</title>
<style>
:root{--bg:#f3f6f8;--surface:#fff;--field:#fff;--fg:#0a1e30;--muted:#4f6577;--line:#4f6577;--sep:#c5ced3;--accent:#3730a3;--btn:#3730a3;--btnfg:#fff;--focus:#7b3e00;--soft:#e8e9fb;
--ok:#15563c;--ok-bg:#e1f3ea;--warn:#7a4a00;--warn-bg:#fff0d0;--bad:#a82a20;--bad-bg:#fbe6e3;--info:#3730a3;--info-bg:#e8e9fb;--neu:#4f6577;--neu-bg:#e9eef1;--side:#fff}
[data-theme=dark]{--bg:#0a1e30;--surface:#11293d;--field:#0a1e30;--fg:#e3eef6;--muted:#9fb3c4;--line:#4f7c9e;--sep:#2c4a63;--accent:#a5b4fc;--btn:#a5b4fc;--btnfg:#0a1e30;--focus:#f5d773;--soft:#1d2a5c;
--ok:#abebcf;--ok-bg:#12372b;--warn:#ffd479;--warn-bg:#3b2e10;--bad:#ff9e94;--bad-bg:#3a1b1e;--info:#a5b4fc;--info-bg:#1d2a5c;--neu:#9fb3c4;--neu-bg:#1b3347;--side:#0d2438}
*{box-sizing:border-box}
body{margin:0;background:#dfe5ea;color:var(--fg);font:16px/1.5 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
[data-theme=dark] body{background:#061522}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
a{color:var(--accent)}
/* barra do protótipo (não faz parte do produto) */
.proto{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 16px;background:#0a1e30;color:#e3eef6;font-size:14px}
.proto b{margin-right:4px}.proto label{display:flex;gap:6px;align-items:center}
.proto select,.proto button{background:#11293d;color:#e3eef6;border:1px solid #4f7c9e;border-radius:6px;padding:4px 8px;min-height:32px;cursor:pointer}
.proto button[aria-pressed=true]{background:#a5b4fc;color:#0a1e30}
.proto a{color:#a5b4fc}
.stage{display:flex;justify-content:center;padding:16px}
.frame{container-type:inline-size;width:100%;background:var(--bg);color:var(--fg);box-shadow:0 2px 14px rgba(0,0,0,.25);min-height:720px;position:relative;overflow:hidden}
.v-c .frame{max-width:1440px}.v-t .frame{max-width:768px}.v-m .frame{max-width:375px}.v-p .frame{max-width:1024px}
.proto{gap:8px 24px;padding:10px 16px}.proto .pt{flex-basis:100%;font-size:13px;letter-spacing:.02em}.proto .pt small{font-weight:400;opacity:.8}
.pg{display:flex;gap:6px;align-items:center;padding-left:12px;border-left:1px solid #4f7c9e}.pg:first-of-type{border-left:0;padding-left:0}.pl{font-size:12px;opacity:.85;margin-right:2px}
.brand{text-decoration:none;color:inherit}.brand:hover span{text-decoration:underline}
.nav .grp{margin:16px 12px 4px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;cursor:pointer;flex:none}.back:hover{border-color:var(--accent);color:var(--accent)}
div>.back:first-child{margin-bottom:16px}
.crumb ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:2px 0}.crumb li+li::before{content:"/";margin:0 8px;color:var(--muted)}.crumb a{color:var(--muted);text-underline-offset:3px}.crumb a:hover{color:var(--accent)}.crumb [aria-current]{color:var(--fg);font-weight:600}
.meta{margin:0 0 4px;font-size:14px;color:var(--muted)}.meta .api{margin-left:4px;font-size:13px}
.page-head{margin-bottom:8px;gap:16px}.content>*+*{margin-top:24px}.content>.chips{margin-top:16px}.content>.card+.card{margin-top:24px}
.acoes{border-left:4px solid var(--accent)}
/* estrutura */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:720px}
.side{background:var(--side);border-right:1px solid var(--sep);padding:20px 16px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:2px}.brand img{width:40px;height:40px}.brand span{font-size:22px;font-weight:700}
.tag{font-size:14px;color:var(--muted);margin:0 0 24px}
.nav a{display:flex;gap:10px;align-items:center;min-height:44px;padding:0 12px;border-radius:8px;color:var(--fg);text-decoration:none;border:1px solid transparent}
.nav a svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.nav a[aria-current=page]{background:var(--soft);color:var(--accent);font-weight:600;border-color:var(--accent)}
.sidefoot{margin-top:auto;border-top:1px solid var(--sep);padding-top:12px;font-size:14px;color:var(--muted)}.sidefoot b{display:block;color:var(--fg)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;gap:12px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--sep);background:var(--surface);font-size:14px}
.top .crumb{flex:1;color:var(--muted);min-width:0}.top .menu{display:none}
.who{text-align:right;line-height:1.2}.who small{color:var(--muted)}
.content{padding:24px;flex:1}
h1{font-size:28px;line-height:1.2;margin:0 0 4px}h2{font-size:18px;margin:0 0 8px}h3{font-size:16px;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 20px}
.foot{padding:12px 24px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--sep);border-radius:12px;padding:20px}
.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:2fr 1fr}.g2e{grid-template-columns:1fr 1fr}
.big{font-size:36px;font-weight:700;line-height:1}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:14px}
.badge{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:2px 10px;border-radius:6px;border:1px solid currentColor;font-size:14px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:8px;height:8px;background:currentColor;flex:none}
.b-ok{color:var(--ok);background:var(--ok-bg)}.b-ok::before{border-radius:50%}
.b-warn{color:var(--warn);background:var(--warn-bg)}.b-warn::before{clip-path:polygon(50% 0,100% 100%,0 100%)}
.b-bad{color:var(--bad);background:var(--bad-bg)}.b-bad::before{transform:rotate(45deg)}
.b-info{color:var(--info);background:var(--info-bg)}.b-info::before{border-radius:2px}
.b-neu{color:var(--neu);background:var(--neu-bg);border-style:dashed}.b-neu::before{background:none;border:2px solid currentColor;border-radius:50%}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 22px;border-radius:8px;border:1px solid var(--accent);background:var(--btn);color:var(--btnfg);font-weight:600;cursor:pointer;text-decoration:none}
.btn.sec{background:var(--surface);color:var(--accent)}.btn.dng{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.btn[disabled],.btn.dis{background:var(--neu-bg);color:var(--neu);border:1px dashed var(--neu);cursor:not-allowed}
.btn.busy::after{content:"…";margin-left:6px}
.field{display:grid;gap:6px;margin-bottom:16px}.field label{font-weight:600}
.field input,.field textarea,.field select{background:var(--field);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:8px 12px;width:100%}
.err{color:var(--bad);font-size:14px;font-weight:600}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:10px;border:1px solid currentColor;margin-bottom:16px;font-weight:500}
.n-bad{color:var(--bad);background:var(--bad-bg)}.n-warn{color:var(--warn);background:var(--warn-bg)}.n-info{color:var(--info);background:var(--info-bg)}.n-ok{color:var(--ok);background:var(--ok-bg)}
.notice .ic{font-weight:700}
.list{display:grid;gap:0}.item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;padding:14px 0;border-top:1px solid var(--sep)}
.item:first-child{border-top:0}.item .t{font-weight:600}
table{width:100%;border-collapse:collapse}caption{text-align:left;font-weight:600;padding-bottom:8px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--sep);vertical-align:top}th{font-size:14px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--sep);margin:16px 0}.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;min-height:44px}.tabs a[aria-current=page]{color:var(--accent);font-weight:600;border-color:var(--accent)}
.tl{display:grid;grid-template-columns:56px 1fr;gap:8px 12px;margin:0;padding:0;list-style:none}.tl time{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}.chips a{padding:4px 12px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font-size:14px;min-height:32px;display:inline-flex;align-items:center}.chips a[aria-current=page]{background:var(--btn);color:var(--btnfg);border-color:var(--accent)}
.api{font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:8px;white-space:nowrap}
.center{max-width:420px;margin:48px auto;padding:0 24px}
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:720px}.auth .l{background:var(--soft);padding:48px;display:flex;flex-direction:column;justify-content:space-between}.auth .l h1{font-size:34px}.auth .r{padding:48px;display:flex;flex-direction:column;justify-content:center;max-width:560px}
.map td a{font-weight:600}
/* responsivo (por largura do quadro, não da janela) */
@container (max-width:900px){.g3,.g2,.g2e{grid-template-columns:1fr}.shell{grid-template-columns:1fr}.side{display:none}.nav-open .side{display:flex;position:absolute;z-index:10;inset:0 20% 0 0;box-shadow:4px 0 16px rgba(0,0,0,.3)}.top .menu{display:inline-flex}.content{padding:16px}.auth{grid-template-columns:1fr}.auth .l{padding:24px;min-height:160px}.auth .r{padding:24px;max-width:none}}
@container (max-width:560px){.item{grid-template-columns:1fr}.top{padding:10px 12px}.who small{display:none}.coletab{display:none}h1{font-size:24px}table.stack thead{display:none}table.stack tr{display:block;border:1px solid var(--sep);border-radius:10px;padding:8px;margin-bottom:10px}table.stack td{display:block;border:0;padding:4px 8px}table.stack td::before{content:attr(data-h)": ";color:var(--muted);font-size:13px}}
</style>
</head>

function mapa(){const cnt={};MAPA.forEach(m=>cnt[m.f?'feito':'fase2']=(cnt[m.f?'feito':'fase2']||0)+1);
 const pages=[...new Set(MAPA.map(m=>m.p))];
 return `<div style="padding:24px">${back('#/'+$('#role').value+'/visao','Voltar ao painel')}<h1>Mapa de telas</h1><p class="lead">As ${MAPA.length} telas do protótipo do Vinícius. <b>${cnt.feito||0}</b> estão neste protótipo e <b>${cnt.fase2||0}</b> ficam para a Fase 2. “Situação na API” segue o README do protótipo.</p>${pages.map(p=>`<h2 style="margin-top:20px">${p}</h2><div class="card map"><table class="stack"><thead><tr><th>Quadro</th><th>Perfil</th><th>Situação na API</th><th>Tarefa do plano</th><th>Neste protótipo</th></tr></thead><tbody>${MAPA.filter(m=>m.p===p).map(m=>`<tr><td data-h="Quadro"><b>${m.t}</b><br><span class="small muted">${m.k}</span></td><td data-h="Perfil">${m.r||'-'}</td><td data-h="API">${m.a}</td><td data-h="Tarefa">${m.d}</td><td data-h="Neste protótipo">${m.f?`<a href="#${m.f}">Abrir</a>`:B('neu','Fase 2')}</td></tr>`).join('')}</tbody></table></div>`).join('')}</div>`;}
/* ---- roteamento ---- */
function render(){
 const q=new URLSearchParams(location.hash.split('?')[1]||'');
 if(q.get('t'))setTheme(q.get('t'));if(q.get('v'))setView(q.get('v'));
 const [r,a,b,c]=location.hash.replace(/^#\//,'').split('?')[0].split('/');
 const fr=$('#frame');let h;const role=ROLES[r]?r:($('#role').value);
 if(!r||r==='login')h=login(a);else if(r==='mapa')h=mapa();else if(r==='biblioteca')h=biblioteca();else if(r==='estados')h=estados();
 else{$('#role').value=role;const area=a||'visao';
  h=({visao:()=>visao(role,b),fila:()=>fila(role,b),historico:()=>historico(role),incidente:()=>incidente(role,b,c),saude:()=>saude(role),auditoria:()=>auditoria(role),aprov:()=>aprov(role,b),diag:()=>diag(role,b)}[area]||(()=>visao(role)))();}
 fr.innerHTML=h;fr.classList.remove('nav-open');const m=$('#menu');if(m)m.onclick=()=>fr.classList.toggle('nav-open');window.scrollTo(0,0);}
function setTheme(t){document.documentElement.dataset.theme=t;$('#t-l').setAttribute('aria-pressed',t==='light');$('#t-d').setAttribute('aria-pressed',t==='dark')}
function setView(v){document.body.className='v-'+v;document.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v))}
$('#t-l').onclick=()=>{setTheme('light');render()};$('#t-d').onclick=()=>{setTheme('dark');render()};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{setView(b.dataset.v);render()});
$('#role').onchange=()=>{const h=location.hash.split('/');if(h.length>2){h[1]=$('#role').value;location.hash=h.join('/')}else location.hash='#/'+$('#role').value+'/visao'};
/* voltar: usa o histórico do protótipo; se não houver, vai à tela-pai */
let TRAIL=[];
document.addEventListener('click',e=>{const b=e.target.closest('[data-back]');if(!b)return;e.preventDefault();if(TRAIL.length>1){history.back()}else location.hash=b.dataset.back});
window.addEventListener('hashchange',()=>{const h=location.hash;if(TRAIL.length>1&&TRAIL[TRAIL.length-2]===h)TRAIL.pop();else TRAIL.push(h)});
TRAIL.push(location.hash);
window.addEventListener('hashchange',render);setView('c');render();
</script>
</body>
</html>
