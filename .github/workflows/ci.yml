name: CI Infrastructure Validation

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop, 'release/**']

jobs:
  validate-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate credentials and Compose without starting containers
        run: python scripts/validate_compose_credentials.py

      # Hermético: compose, lock, portas e binds, sem rede. A conferência no
      # Docker Hub fica no workflow agendado (infra-registry.yml) para que o
      # estado externo não reprove PR que não toca em infraestrutura (#56).
      - name: Validate published ports and locked image references (no network)
        run: python scripts/validate_infrastructure.py
