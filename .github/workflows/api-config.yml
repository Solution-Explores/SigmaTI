name: API and engineering regression

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - run: .venv/bin/python -m pip check
      - name: Test API and engineering with repository pytest configuration
        run: .venv/bin/python -m pytest -q -p no:cacheprovider --junitxml=test-results/api.xml
      - name: Acceptance through real HTTP and simulated AI
        run: .venv/bin/python scripts/validate_api_acceptance.py --output test-results/http.json --port 18001
      - name: Measure every annotated PII identifier
        run: .venv/bin/python scripts/executar_experimento_e6.py --output test-results/e6.md
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sigma-frontend/package-lock.json
      - run: npm ci --include=optional
        working-directory: sigma-frontend
      - run: npm run build && npm run lint
        working-directory: sigma-frontend
      - run: npx playwright install --with-deps chromium
        working-directory: sigma-frontend
      - run: npm run test:e2e
        working-directory: sigma-frontend
      - name: Publish test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            test-results/*.xml
            test-results/http.json
            test-results/e6.md
            test-results/painel-diagnostico.png
          if-no-files-found: warn
