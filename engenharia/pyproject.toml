[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-eng"
version = "0.1.0"
description = "Nucleo de engenharia do SigmaTI: sondas, SLOs, incidentes e auditoria"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
api = ["fastapi==0.142.2"]
dev = ["fastapi==0.142.2", "httpx2==2.13.1", "pytest==9.1.1"]

[project.urls]
Repository = "https://github.com/Solution-Explores/SigmaTI"
Issues = "https://github.com/Solution-Explores/SigmaTI/issues"

[tool.setuptools]
packages = ["sigma_eng"]
include-package-data = false
